#     "src/my_app/domain/*",
#     "src/my_app/pricing/*",
# ]
# do_not_mutate = [
#     "*__init__.py",
#     "*migrations*",
#     "*cli.py",
# ]
#
# # ログ文言などの低価値ノイズを除外（raise は例外型検証の見逃しを防ぐため必要時のみ追加）
# do_not_mutate_patterns = [
#     'logger\.\w+',
# ]
#
# # カバレッジ計測済みの行だけ変異させる（pytest-cov / coverage.py 必須）
# mutate_only_covered_lines = true
#
# # 高速なユニットテストだけを対象にする
# pytest_add_cli_args_test_selection = [
#     "-m", "not integration and not slow",
#     "tests/unit/",
# ]
#
# # 呼び出しスタックが深い間接テストを除外して高速化
# max_stack_depth = 8
#
# # 型チェックで落ちる無意味なミュータントを事前除外（mypy または pyrefly に対応）
# type_check_command = [
#     "mypy", "src", "--output", "json", "--disable-error-code", "unused-ignore",
# ]
#
# # テスト実行に必要な補助ファイルがあればコピー対象に追加
# also_copy = [
#     "tests/conftest.py",
# ]
#
# # grpc / torch / gevent / 非同期イベントループ等でハングする場合は forkserver を指定
