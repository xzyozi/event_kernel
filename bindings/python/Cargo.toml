[package]
name = "event-kernel-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Deterministic Event Kernel の PyO3 Python バインディング（EK-IF-001 IF-002/IF-003）"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
event-kernel-adapters = { path = "../../adapters" }
event-kernel-core = { path = "../../core" }
pyo3 = "0.30.1"
