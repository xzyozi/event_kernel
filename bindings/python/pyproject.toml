[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "event-kernel"
version = "0.1.0"
requires-python = ">=3.10"
description = "Deterministic Event Kernel Python バインディング"

[tool.maturin]
python-source = "python"
module-name = "event_kernel._core"
features = ["extension-module"]
