[package]
name = "event-kernel-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Deterministic Event Kernel の外部ポート実装・ファイル/Parquet フィード・原子永続化アダプタ（EK-BD-001 2.1節、EK-DS-001 3.1節）"

[lib]
name = "ek_adapters"

[dependencies]
event-kernel-core = { path = "../core" }
parquet = { version = "60.2.0", default-features = false, features = ["snap", "flate2-zlib-rs"] }
